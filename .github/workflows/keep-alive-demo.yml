name: Keep Supabase Alive

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: inventory-app   # ★追加

    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Supabaseライブラリをインストール
        run: npm install

      - name: Secrets確認
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            echo "SUPABASE_URL: 設定されています"
          else
            echo "SUPABASE_URL: 設定されていません"
          fi

          if [ -n "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_ANON_KEY: 設定されています"
          else
            echo "SUPABASE_ANON_KEY: 設定されていません"
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_2 }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_2 }}

      - name: Keep Alive実行
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_2 }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_2 }}
        run: node keepAlive.js