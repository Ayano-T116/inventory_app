name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: inventory-app   # ★追加

    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Supabaseライブラリをインストール
        run: npm install

      - name: Keep Alive実行
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_1 }}
        run: node keepAlive.js